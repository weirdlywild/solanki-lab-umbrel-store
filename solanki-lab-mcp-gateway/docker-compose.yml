version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-mcp-gateway_mcp-gateway_1
      APP_PORT: 3333

  mcp-gateway:
    image: ghcr.io/weirdlywild/mcp-gateway:0.7.1@sha256:3bb613b9b5f3e78a54be14e79d3cf9b237baacdda3f35196fb33d0bdd1d54c11
    restart: on-failure
    init: true
    environment:
      MCP_GATEWAY_PORT: "3333"
      MCP_GATEWAY_STORAGE: /data
      MCP_GATEWAY_TOKEN: ${APP_PASSWORD}
      DEBUG: ""
    volumes:
      - ${APP_DATA_DIR}/data:/data
