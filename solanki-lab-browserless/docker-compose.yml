version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-browserless_browserless_1
      APP_PORT: 3000

  browserless:
    image: ghcr.io/browserless/chromium:v2.56.7@sha256:b1ba7b054af2891a8199f884d4bd249cf8c3bd2fa8a97b339077e40f92803ba8
    restart: on-failure
    init: true
    shm_size: 2g
    environment:
      TOKEN: ${APP_SEED}
      CONCURRENT: "10"
      QUEUED: "10"
      TIMEOUT: "30000"
      CORS: "false"
      ALLOW_GET: "false"
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: warn
      TZ: UTC
