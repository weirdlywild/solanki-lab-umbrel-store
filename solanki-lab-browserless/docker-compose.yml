version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-browserless_browserless_1
      APP_PORT: 3000

  browserless:
    image: ghcr.io/browserless/chromium:v2.56.7@sha256:b1ba7b054af2891a8199f884d4bd249cf8c3bd2fa8a97b339077e40f92803ba8
    restart: on-failure
    init: true
    shm_size: 2g
    environment:
      TOKEN: ${APP_SEED}
      HOST: 0.0.0.0
      PORT: "3000"
      CONCURRENT: "10"
      QUEUED: "10"
      TIMEOUT: "30000"
      CORS: "false"
      CORS_ALLOW_ORIGIN: "*"
      CORS_MAX_AGE: "2592000"
      ALLOW_GET: "false"
      ALLOW_FILE_PROTOCOL: "false"
      HEALTH: "false"
      MAX_CPU_PERCENT: "99"
      MAX_MEMORY_PERCENT: "99"
      HEARTBEAT_INTERVAL: "30000"
      DISABLE_BLOCKLIST: "false"
      OTEL_ENABLED: "false"
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      LOG_LEVEL: warn
      LOG_FORMAT: plain
      TZ: UTC
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/downloads:/downloads
