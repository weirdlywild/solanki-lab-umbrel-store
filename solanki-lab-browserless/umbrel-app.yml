manifestVersion: 1.1
id: solanki-lab-browserless
category: developer
name: Browserless
version: "2.56.7"
tagline: Headless Chrome API server for Puppeteer, Playwright & MCP
description: >-
  Browserless is a self-hosted headless Chrome service that lets you run Puppeteer,
  Playwright and MCP browser automation at scale — without running Chrome in your
  own code.


  It exposes a WebSocket endpoint (ws://<your-umbrel>:<port>) that standard,
  unpatched Puppeteer and Playwright libraries connect to, plus REST-style endpoints
  for scraping, PDF generation and screenshots.


  Open the app to browse the interactive API documentation at /docs and the
  Debug Viewer for live browser sessions.


  🔑 Authentication is handled with a TOKEN. Use it as the token in your Puppeteer
  or Playwright connection string, e.g.:
  puppeteer.connect({ browserWSEndpoint: 'ws://<your-umbrel>:<port>?token=<token>' })


  ⚠️ Browserless v2 serves at the root path only — a sub-path (base path) is not
  supported. This app is exposed through umbrel's app proxy on its own port.
website: https://browserless.io
dependencies: []
repo: https://github.com/browserless/browserless
support: https://github.com/browserless/browserless/issues
port: 3000
gallery:
  - 1.webp
  - 2.webp
path: ""
defaultUsername: ""
defaultPassword: ""
icon: https://cdn.jsdelivr.net/gh/weirdlywild/solanki-lab-umbrel-store/solanki-lab-browserless/icon.svg
environment:
  - name: CONCURRENT
    services:
      - browserless
    default: "10"
    note: Max concurrent browser sessions (default 10).
  - name: QUEUED
    services:
      - browserless
    default: "10"
    note: Max queued requests before returning HTTP 429 (default 10).
  - name: TIMEOUT
    services:
      - browserless
    default: "30000"
    note: Session timeout in milliseconds (default 30000, -1 for no timeout).
  - name: CORS
    services:
      - browserless
    default: "false"
    options:
      - "false"
      - "true"
    note: Enable CORS headers on all routes.
  - name: ALLOW_GET
    services:
      - browserless
    default: "false"
    options:
      - "false"
      - "true"
    note: Enable GET requests for the /json, /content and /pdf endpoints.
  - name: ALLOW_FILE_PROTOCOL
    services:
      - browserless
    default: "false"
    options:
      - "false"
      - "true"
    note: Allow file:// protocol access inside browser sessions. Security risk — only enable when you trust your token holders.
  - name: HEALTH
    services:
      - browserless
    default: "false"
    options:
      - "false"
      - "true"
    note: Pre-request health checks on /pressure. Enable to block requests while the browser is unhealthy.
  - name: MAX_CPU_PERCENT
    services:
      - browserless
    default: "99"
    note: Maximum CPU load percentage before requests are blocked (used with HEALTH).
  - name: MAX_MEMORY_PERCENT
    services:
      - browserless
    default: "99"
    note: Maximum memory load percentage before requests are blocked (used with HEALTH).
  - name: LOG_LEVEL
    services:
      - browserless
    default: warn
    options:
      - warn
      - info
      - debug
      - trace
    note: Logging verbosity (trace is most verbose).
  - name: TZ
    services:
      - browserless
    default: UTC
    note: IANA time zone, e.g. America/New_York or Europe/London.
releaseNotes: ""
developer: Browserless
submitter: Solanki Lab
submission: https://github.com/weirdlywild/solanki-lab-umbrel-store
