manifestVersion: 1.1
id: solanki-lab-browserless
category: developer
name: Browserless
version: "2.56.7-patch.1"
tagline: Headless Chrome API server for Puppeteer, Playwright & MCP
description: >-
  Browserless is a self-hosted headless Chrome service that lets you run Puppeteer,
  Playwright and MCP browser automation at scale — without running Chrome in your
  own code.


  It exposes a WebSocket endpoint (ws://<your-umbrel>:<port>) that standard,
  unpatched Puppeteer and Playwright libraries connect to, plus REST-style endpoints
  for scraping, PDF generation and screenshots.


  Open the app to browse the interactive API documentation at /docs and the
  Debug Viewer for live browser sessions.


  🔑 Authentication is handled with a TOKEN. Use it as the token in your Puppeteer
  or Playwright connection string, e.g.:
  puppeteer.connect({ browserWSEndpoint: 'ws://<your-umbrel>:<port>?token=<token>' })


  ⚠️ Browserless v2 serves at the root path only — a sub-path (base path) is not
  supported. This app is exposed through umbrel's app proxy on its own port.


  📦 Note: this package does not mount a persistent data directory — Browserless
  session data (cookies/cache) uses the container's temp space, which is reset
  when the app restarts. This matches the upstream default.
website: https://browserless.io
dependencies: []
repo: https://github.com/browserless/browserless
support: https://github.com/browserless/browserless/issues
port: 3000
gallery:
  - https://cdn.jsdelivr.net/gh/weirdlywild/solanki-lab-umbrel-store@main/solanki-lab-browserless/1.webp
  - https://cdn.jsdelivr.net/gh/weirdlywild/solanki-lab-umbrel-store@main/solanki-lab-browserless/2.webp
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
icon: https://cdn.jsdelivr.net/gh/weirdlywild/solanki-lab-umbrel-store@main/solanki-lab-browserless/icon.svg
environment:
  - name: CONCURRENT
    services:
      - browserless
    default: "10"
    note: Max concurrent browser sessions (default 10).
  - name: QUEUED
    services:
      - browserless
    default: "10"
    note: Max queued requests before returning HTTP 429 (default 10).
  - name: TIMEOUT
    services:
      - browserless
    default: "30000"
    note: Session timeout in ms (default 30000, -1 for no timeout).
  - name: MAX_RECONNECT_TIME
    services:
      - browserless
    default: ""
    note: Max reconnection timeout (ms) for sessions after disconnect. Empty = no limit.
  - name: CORS
    services:
      - browserless
    default: "false"
    options:
      - "false"
      - "true"
    note: Enable CORS headers on all routes.
  - name: CORS_ALLOW_ORIGIN
    services:
      - browserless
    default: "*"
    note: Allowed CORS origins when CORS is enabled.
  - name: CORS_ALLOW_METHODS
    services:
      - browserless
    default: ""
    note: Allowed HTTP methods when CORS is enabled (empty = all).
  - name: CORS_MAX_AGE
    services:
      - browserless
    default: "2592000"
    note: CORS preflight cache max age in seconds.
  - name: ALLOW_GET
    services:
      - browserless
    default: "false"
    options:
      - "false"
      - "true"
    note: Enable GET requests for the /json, /content and /pdf endpoints.
  - name: ALLOW_FILE_PROTOCOL
    services:
      - browserless
    default: "false"
    options:
      - "false"
      - "true"
    note: Allow file:// protocol access inside sessions. Security risk — only enable when you trust your token holders.
  - name: HEALTH
    services:
      - browserless
    default: "false"
    options:
      - "false"
      - "true"
    note: Pre-request health checks on /pressure. Enable to block requests while the browser is unhealthy.
  - name: MAX_CPU_PERCENT
    services:
      - browserless
    default: "99"
    note: Max CPU load % before requests are blocked (used with HEALTH).
  - name: MAX_MEMORY_PERCENT
    services:
      - browserless
    default: "99"
    note: Max memory load % before requests are blocked (used with HEALTH).
  - name: HEARTBEAT_INTERVAL
    services:
      - browserless
    default: "30000"
    note: WebSocket heartbeat interval in ms. Lower when behind load balancers with aggressive idle timeouts.
  - name: DISABLE_BLOCKLIST
    services:
      - browserless
    default: "false"
    options:
      - "false"
      - "true"
    note: Disable the URL blocklist that prevents navigation to localhost, private IPs and cloud metadata endpoints.
  - name: OTEL_ENABLED
    services:
      - browserless
    default: "false"
    options:
      - "false"
      - "true"
    note: Enable OpenTelemetry instrumentation.
  - name: LOG_LEVEL
    services:
      - browserless
    default: warn
    options:
      - trace
      - debug
      - info
      - warn
      - error
      - fatal
      - silent
    note: Application log level.
  - name: LOG_FORMAT
    services:
      - browserless
    default: plain
    options:
      - plain
      - json
    note: Log output format. json for structured logs for aggregation pipelines.
  - name: TZ
    services:
      - browserless
    default: UTC
    note: IANA time zone, e.g. America/New_York or Europe/London.
releaseNotes: >-
  - Fix: browser sessions failed with EACCES permission denied on /data. Removed
    the persistent data/download mounts (session data uses container temp space,
    matching the upstream default). Existing installs: update and restart to fix.
developer: Browserless
submitter: Solanki Lab
submission: https://github.com/weirdlywild/solanki-lab-umbrel-store
