version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-browser-use_browser-use_1
      APP_PORT: 8766

  browser-use:
    image: ghcr.io/weirdlywild/solanki-lab-browser-use:0.9.6-patch.1@sha256:83990dc3134fe4c4ce36ae7a95a8ff9a6f36e3564473334d3ad29dd0811bdac1
    restart: on-failure
    init: true
    shm_size: 2g
    environment:
      ANONYMIZED_TELEMETRY: "false"
      BROWSER_USE_HEADLESS: "true"
      # The fork's README sets both of these. Without the skip flag the CLI
      # insists on a provider key at startup even for the primitive tools
      # (navigate/click/type) that drive the browser directly and need no LLM.
      SKIP_LLM_API_KEY_VERIFICATION: "true"
      HEADLESS_EVALUATION: "false"
      # Provider selection. browser_use/config.py hardcodes a default LLM entry
      # with the literal key 'your-openai-api-key-here' (config.py:290), so an
      # empty OPENAI_API_KEY silently sends every request to api.openai.com and
      # fails. DEFAULT_LLM is read at config.py:164 and used by
      # agent/service.py:185 as the default model, and its value is
      # provider/model. The installed build ships an `openrouter` provider
      # (browser_use/llm/openrouter), so an OpenAI-compatible gateway is
      # selectable without any code change.
      #
      # Both values are interpolated rather than literal so no secret is ever
      # committed. Supply them from a .env file in the app's compose project
      # directory, which umbreld's docker compose invocation reads.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEFAULT_LLM: ${DEFAULT_LLM:-}
      # LLM provider key consumed by the browser-use agent for steering.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
