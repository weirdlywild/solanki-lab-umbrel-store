version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-browser-use_browser-use_1
      APP_PORT: 8766

  browser-use:
    image: ghcr.io/weirdlywild/solanki-lab-browser-use:0.9.6-patch.1@sha256:83990dc3134fe4c4ce36ae7a95a8ff9a6f36e3564473334d3ad29dd0811bdac1
    restart: on-failure
    init: true
    shm_size: 2g
    environment:
      ANONYMIZED_TELEMETRY: "false"
      BROWSER_USE_HEADLESS: "true"
      # The fork's README sets both of these. Without the skip flag the CLI
      # insists on a provider key at startup even for the primitive tools
      # (navigate/click/type) that drive the browser directly and need no LLM.
      SKIP_LLM_API_KEY_VERIFICATION: "true"
      HEADLESS_EVALUATION: "false"
      # Provider credentials are deliberately NOT declared here. Every variable
      # in this app is an exposed environment entry in umbrel-app.yml, and
      # umbreld merges the operator's values into
      # docker-compose.umbrel-user-settings.yml as literals.
      #
      # Do not add `${VAR}` interpolation for them. Compose resolves `${VAR:-}`
      # to an empty string when the variable is absent from its own
      # environment, which overwrites the merged literal and delivers an empty
      # value to the container. That is why OPENROUTER_API_KEY and DEFAULT_LLM
      # arrived present but empty. Declaring the keys only in umbrel-app.yml
      # keeps secrets out of git and lets the merge win.
