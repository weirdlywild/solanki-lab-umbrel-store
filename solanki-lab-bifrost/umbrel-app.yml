manifestVersion: 1.1
id: solanki-lab-bifrost
category: developer
name: Bifrost
version: "2.2.3-probe.3"
tagline: "Maxim AI's Apache-2.0 gateway: a web dashboard plus a token-authenticated MCP endpoint"
description: >-
  Bifrost is an open-source AI gateway that also works as an MCP gateway. It
  registers MCP servers once and exposes their tools through a single endpoint,
  with a built-in web dashboard for configuration.


  🔐 Unlike most gateways in this space, Bifrost authenticates the client-to-gateway
  hop. With `enforce_auth_on_inference` enabled, every `/mcp` request must present a
  Virtual Key as `Authorization: Bearer <key>`, and each key sees only the tools it
  is allowed. An inactive or expired key is refused with 403. That is
  deny-by-default, and it is the reason for choosing this over Fiberplane.


  🖥️ Open `http://<your-umbrel>:8080/` for the dashboard. The UI and the
  authenticated `/mcp` endpoint are separate surfaces, so having a dashboard does
  not require turning authentication off.


  Single Go binary in one container. State is two SQLite databases under this app's
  data directory. No Postgres, Redis or nginx, and no host Docker socket.


  ⚠️ This is a probe build, installed to measure its real memory footprint before
  the package is finalised. Bifrost publishes a 3.3 GB peak figure under load, and
  the idle figure is what decides whether it is worth keeping on this host.
website: https://www.getmaxim.ai/mcp-gateway
dependencies: []
repo: https://github.com/maximhq/bifrost
support: https://github.com/maximhq/bifrost/issues
port: 8080
gallery: []
path: "/"
defaultUsername: ""
defaultPassword: ""
icon: https://cdn.jsdelivr.net/gh/weirdlywild/solanki-lab-umbrel-store@main/solanki-lab-bifrost/icon.svg
releaseNotes: >-
  - Now tracks the current release line, v2.2.3 (linux/amd64 + linux/arm64), digest-pinned
  - The previous probe build was pinned to v1.3.9, which turns out to be a stale bundle: it ships Bifrost's MCP *client* side, so upstream servers register and their tools are discovered, but it has no client-facing /mcp route at all and answers POST /mcp with 405. The current v2.2.3 transport is what serves /mcp.
  - v2.2.3 sets USER 1000:0 explicitly instead of relying on the named appuser, so the UID reasoning is now a documented fact rather than an inference
  - Single Go binary, one container, SQLite state under the app data directory
  - No host Docker socket, which was the hard blocker for Obot
  - The image already runs as UID 1000 via adduser -D, which matches umbrel's app data ownership, so no user override is needed
  - Authentication of /mcp via Virtual Keys is configured in a follow-up once the boot behaviour and memory footprint are confirmed
developer: Maxim AI
submitter: Solanki Lab
submission: https://github.com/weirdlywild/solanki-lab-umbrel-store

# Secrets are deliberately declared with empty defaults. They must be filled in
# under umbrel App Settings -> Environment, which is umbrel's own masked input,
# so no secret value ever lands in this repository or in a chat transcript.
#
# BIFROST_SETUP_TOKEN is mandatory before the first admin account can be
# created. Without it Bifrost logs a warning and rejects any attempt to create
# that account, which is the intended fail-closed behaviour.
#
# Bifrost resolves `env.NAME` references from the container environment, so the
# values stay out of the config file and out of git entirely.
environment:
  - name: BIFROST_SETUP_TOKEN
    description: >-
      One-time token required to create the first Bifrost admin account. Any
      long random string. Rotate or discard after the admin exists.
  - name: BIFROST_ADMIN_USERNAME
    description: Username for the Bifrost dashboard at port 8080.
  - name: BIFROST_ADMIN_PASSWORD
    description: Password for the Bifrost dashboard. Use a long random string.
