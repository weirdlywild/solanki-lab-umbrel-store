version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-bifrost_bifrost_1
      APP_PORT: 8080
      # Off. Bifrost authenticates /mcp itself with Virtual Keys, and its web UI
      # has its own sign-in. An umbrel login in front of both would add a second
      # credential to manage without protecting anything the app does not already.
      # Note: a manifest `appProxyAuth` block is inert on this umbrelOS build, so
      # the compose service environment is the control that actually takes effect.
      PROXY_AUTH_ADD: "false"

  bifrost:
    image: maximhq/bifrost:v2.2.3@sha256:975487b95c6399de26e3a108164f21ae52687b316580a13ff0c239b865649ed2
    restart: on-failure
    # No `user:` override on purpose. Since v2.2.3 the image sets `USER 1000:0`
    # explicitly, which is exactly the 1000:1000 that umbrel creates
    # APP_DATA_DIR as, so the gateway writes its SQLite databases with no
    # ownership fix. (The older v1.3.9 image used the named user `appuser`,
    # which Alpine resolves to UID 1000 anyway. ContextForge needed
    # `user: "1000:0"` because its image hardcodes USER 10001.)
    #
    # No /var/run/docker.socket. Bifrost is a proxy and does not spawn MCP
    # servers, so it has no reason to want one. That requirement is what made
    # Obot impossible to package.
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      LOG_LEVEL: "info"
      # The image sets LOG_STYLE=json. Human-readable is easier to read in
      # umbrel's app log view when something goes wrong.
      LOG_STYLE: "pretty"
      APP_DIR: "/app/data"
      # v2.2.3 exposes the Go runtime's memory controls. Left unset so the Go
      # runtime self-tunes; measured idle at 71 MB on v1.3.9. Set GOMEMLIMIT to
      # a byte value (for example 512MiB) to put a hard ceiling on the heap if
      # the footprint ever needs bounding.
      GOMEMLIMIT: ""
    volumes:
      # APP_DIR is /app/data and is a declared VOLUME in the image. It holds
      # config.db (SQLite, the UI's configuration) and logs.db.
      - ${APP_DATA_DIR}/data:/app/data
