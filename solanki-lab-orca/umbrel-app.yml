manifestVersion: 1.1
id: solanki-lab-orca
category: developer
name: Orca
version: "1.4.210"
tagline: Always-on headless Orca agent runtime (Claude Code + ECC) with mobile pairing
description: >-
  Orca is an always-on headless agent runtime built from source with the
  mobile-relay patch (PR #22435) so the Orca mobile app can pair to this
  always-reachable server. It bundles Claude Code as the agent backend, ECC
  agent-harness config, and wires your 9Router for model routing.


  Reach it over Tailscale from the Orca mobile app or the web client. The server
  exposes a pairing URL/QR at startup.


  🔑 Model routing goes through 9Router (ANTHROPIC_BASE_URL + key). Clients
  reach the server on port 6768 using ORCA_PAIRING_ADDRESS (your Tailscale IP).


  ⚠️ A full Electron/Chromium runtime runs in this container (~2GB+ RAM). Restrict
  port 6768 to Tailscale — do not expose it publicly.
website: https://github.com/stablyai/orca
dependencies: []
repo: https://github.com/stablyai/orca
support: https://github.com/stablyai/orca/issues
port: 6768
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
appProxyAuth:
  override: true
  enabled: false
icon: https://cdn.jsdelivr.net/gh/weirdlywild/solanki-lab-umbrel-store@main/solanki-lab-orca/icon.svg
environment:
  - name: ANTHROPIC_BASE_URL
    services:
      - orca
    default: "http://192.168.1.38:20128/v1"
    note: 9Router Anthropic-compatible endpoint for Claude Code.
  - name: ANTHROPIC_API_KEY
    services:
      - orca
    default: "sk-orca-local"
    note: 9Router API key for model routing.
  - name: ORCA_PAIRING_ADDRESS
    services:
      - orca
    default: "100.79.230.24"
    note: Tailscale IP/hostname that mobile + web clients use to reach this server.
releaseNotes: >-
  - Source build of stablyai/orca with PR #22435 (mobile relay provider in serve mode)
  - Bundles Claude Code CLI + ECC agent-harness config
  - Wires 9Router via ANTHROPIC_BASE_URL
  - Always-on: restart unless-stopped, persistent pairing data volume
developer: Orca
submitter: Solanki Lab
submission: https://github.com/weirdlywild/solanki-lab-umbrel-store
