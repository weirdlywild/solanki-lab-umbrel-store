version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-orca_orca_1
      APP_PORT: 6768

  orca:
    image: ghcr.io/weirdlywild/orca-alwayson:1.4.210
    restart: unless-stopped
    init: true
    shm_size: 2g
    environment:
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://192.168.1.38:20128/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-orca-local}
      ORCA_PAIRING_ADDRESS: ${ORCA_PAIRING_ADDRESS:-100.79.230.24}
      ORCA_PORT: "6768"
      DISPLAY: ""
    volumes:
      - ${APP_DATA_DIR}/data:/home/node/.config/orca
