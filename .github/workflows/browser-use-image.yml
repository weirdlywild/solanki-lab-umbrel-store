name: publish browser-use image

on:
  workflow_dispatch:
  push:
    paths:
      - "solanki-lab-browser-use/Dockerfile"

env:
  IMAGE: ghcr.io/weirdlywild/solanki-lab-browser-use
  VERSION: "0.9.7-patch.1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: solanki-lab-browser-use
          file: solanki-lab-browser-use/Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true
