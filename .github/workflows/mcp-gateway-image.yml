name: publish mcp-gateway image

on:
  workflow_dispatch:
  push:
    paths:
      - "solanki-lab-mcp-gateway/Dockerfile"

env:
  IMAGE: ghcr.io/weirdlywild/mcp-gateway
  VERSION: "0.7.1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: solanki-lab-mcp-gateway
          file: solanki-lab-mcp-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true
