name: publish 9router-go image

on:
  workflow_dispatch:
  push:
    paths:
      - "solanki-lab-9router-go/Dockerfile"
      - "solanki-lab-9router-go/scripts/init-db.sh"

env:
  IMAGE: ghcr.io/weirdlywild/9router-go
  VERSION: "1.8.18"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: solanki-lab-9router-go
          file: solanki-lab-9router-go/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true
