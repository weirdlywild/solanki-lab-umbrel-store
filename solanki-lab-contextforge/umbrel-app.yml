manifestVersion: 1.1
id: solanki-lab-contextforge
category: developer
name: ContextForge
version: "1.0.1"
tagline: IBM's open-source MCP gateway, registry and admin UI with real token authentication
description: >-
  ContextForge is an Apache-2.0 MCP gateway, registry and proxy from IBM. It
  fronts any number of MCP servers behind a single endpoint, and — unlike most
  gateways in this space — it actually authenticates the client-to-gateway hop.
  Each registered server is exposed at `/servers/<uuid>/mcp` and requires a JWT
  bearer token, with role-based access control and an audit trail behind it.


  🖥️ Sign in at `http://<your-umbrel>:4444/admin` to add servers, mint API
  tokens, and watch traffic. This is a package that opens to a real UI *and*
  keeps its endpoint authenticated, which is the combination the other
  candidates could not give us.


  🔑 No secrets in this repository, and no manual secret setup. `JWT_SECRET_KEY`
  and `AUTH_ENCRYPTION_SECRET` are mandatory — the gateway refuses to start
  without them — so both are derived from your Umbrel device seed in
  `exports.sh`. They are stable across restarts and updates, and regenerating
  them would invalidate every issued token. The derived platform-admin password
  is copied to this app's data directory at mode 600 by a post-start hook, so
  you can read it from the Umbrel UI and sign in. Delete that file once you have
  changed the password.


  Runs as a single container with SQLite. ContextForge's own full compose also
  runs Postgres, Redis, Keycloak and nginx; none of that is needed to serve one
  user, and all of it would be extra containers on a host that already runs 13
  apps.


  Note on API paths: the management API is under `/v1` and the admin UI under
  `/admin`; both require a signed-in session. Each registered MCP server is
  reachable at `/servers/<uuid>/mcp`, which requires a JWT bearer token.

  The gateway logs a warning on startup that its legacy API sunset date has
  passed. **Leave `LEGACY_API_ENABLED` on.** Setting it to `false` silences the
  warning but also removes `/admin/login`, so the app redirects to a page that
  404s and there is no way to sign in from a browser.


  ⚠️ No host Docker socket is mounted, and none is needed — ContextForge proxies
  and registers MCP servers rather than launching them, so it has no reason to
  want one.


  ⚠️ Keep port 4444 on your LAN or Tailscale. It is served over plain HTTP, so
  do not expose it to the internet or through a public reverse-proxy hostname.
website: https://ibm.github.io/mcp-context-forge/
dependencies: []
repo: https://github.com/IBM/mcp-context-forge
support: https://github.com/IBM/mcp-context-forge/issues
port: 4444
gallery: []
path: "/admin"
defaultUsername: ""
defaultPassword: ""
icon: https://cdn.jsdelivr.net/gh/weirdlywild/solanki-lab-umbrel-store@main/solanki-lab-contextforge/icon.svg
environment:
  - name: PLATFORM_ADMIN_EMAIL
    services:
      - gateway
    default: "admin@solanki.home"
    note: Email address for the first platform administrator. Change it to your own before signing in, then change the password.
releaseNotes: >-
  - Fix the admin UI: LEGACY_API_ENABLED=false removed /admin/login, so / redirected to a 404 and the UI could not be signed into at all. It is back on. The startup deprecation warning is cosmetic; the route is not
  - Verified working: the admin UI, the /v1 management API and every per-server MCP endpoint all enforce authentication, and the SQLite database persists across restarts
  - Run as 1000:0. The image defaults to UID 10001 while umbrel creates app data as 1000:1000, so the gateway could not create its database and every worker died during startup without logging an error
  - Absolute sqlite path. SQLAlchemy reads the three-slash form as relative to the process working directory, not the bind mount
  - LEGACY_API_ENABLED=false, which the gateway warns about on startup because those routes are past their sunset date. Expect 404 on unversioned paths like /servers and /tools; the live API is /v1
  - Single container with SQLite. No Postgres, Redis, Keycloak or nginx
  - No host Docker socket
  - JWT_SECRET_KEY, AUTH_ENCRYPTION_SECRET and the platform-admin password are derived from the device seed in exports.sh, so nothing secret is committed. The admin password is written to the app data directory at mode 600 for you to read
developer: IBM
submitter: Solanki Lab
submission: https://github.com/weirdlywild/solanki-lab-umbrel-store
