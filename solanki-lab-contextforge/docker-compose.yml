version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-contextforge_gateway_1
      APP_PORT: 4444
      # Off. ContextForge does its own authentication (AUTH_REQUIRED=true with
      # JWT bearer tokens), so an extra umbrel login in front of it would only
      # get in the way of the admin UI without protecting anything more.
      # A manifest appProxyAuth block was proven inert on this umbrelOS build,
      # so the compose service environment is the control that actually works.
      PROXY_AUTH_ADD: "false"

  gateway:
    # Run as umbrel's app-data owner, not the image default.
    #
    # The Containerfile sets USER 10001:10001, but umbrel creates ${APP_DATA_DIR}
    # owned by 1000:1000. The container therefore could not write its SQLite
    # database: no .db file ever appeared in the app data directory, workers died
    # during application startup with no error logged, and nothing ever listened
    # on 4444. That was the whole failure.
    #
    # GID 0 rather than 1000 because the Containerfile also runs
    # `chgrp 0 /app; chmod 0750 /app` under ENABLE_FIPS. That block is skipped in
    # the public image, so /app is currently world-readable and 1000:1000 would
    # be enough. GID 0 keeps the app working either way: if /app is 0755 the
    # other-bits grant read regardless, and if the FIPS hardening ever applies,
    # group 0 is exactly the group that gets r-x.
    user: "1000:0"
    image: ghcr.io/ibm/mcp-context-forge:latest@sha256:5903d660a89f95f70f98c24c0493d1783c0585663c99ba9a8cc9acafa3cb0f65
    restart: on-failure
    # No /var/run/docker.sock anywhere. ContextForge is a proxy and registry, not
    # a host process spawner, so it has no reason to want it. This is the
    # constraint that made Obot impossible.
    environment:
      HOST: "0.0.0.0"
      PORT: "4444"
      # SQLite only. Their full compose also runs Postgres, Redis, Keycloak and
      # nginx; none of that is needed to serve one user and all of it would be
      # additional containers on a host that already runs 13 apps.
      # Absolute path, four slashes: SQLAlchemy treats sqlite:///x as RELATIVE to
      # the process working directory, so ./data/ pointed at a directory that does
      # not exist in the image and never reached the bind mount. The first probe
      # hung in application startup with no database in the app data directory.
      DATABASE_URL: "sqlite:////app/data/contextforge.db"
      # Authentication on. This is the whole reason for choosing ContextForge:
      # the client-to-gateway hop requires a JWT bearer token, and each server is
      # exposed at /servers/<uuid>/mcp behind that check.
      AUTH_REQUIRED: "true"
      MCPGATEWAY_UI_ENABLED: "true"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      # The umbrel app is served over plain HTTP on the LAN, so secure cookies
      # would stop the admin UI from authenticating at all.
      SECURE_COOKIES: "false"
      # Their own startup log warns that the legacy API sunset date has passed and
      # the routes are overdue for removal. Turning them off removes deprecated
      # surface rather than leaving it enabled past its own deadline.
      LEGACY_API_ENABLED: "false"
      PLATFORM_ADMIN_EMAIL: "${PLATFORM_ADMIN_EMAIL:-admin@solanki.home}"
      PLATFORM_ADMIN_FULL_NAME: "Platform Administrator"
      # Secrets come from exports.sh, which umbrel sources into the environment
      # before compose runs. They are derived from the device seed, so nothing
      # secret is committed and the values are stable across restarts.
      JWT_SECRET_KEY: "${APP_CONTEXTFORGE_JWT_SECRET_KEY}"
      AUTH_ENCRYPTION_SECRET: "${APP_CONTEXTFORGE_AUTH_ENCRYPTION_SECRET}"
      PLATFORM_ADMIN_PASSWORD: "${APP_CONTEXTFORGE_ADMIN_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
