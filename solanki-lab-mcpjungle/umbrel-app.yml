manifestVersion: 1.1
id: solanki-lab-mcpjungle
category: developer
name: MCPJungle
version: "0.4.6-patch.2"
tagline: Self-hosted MCP gateway with a dashboard, client tokens, and deny-by-default access control
description: >-
  MCPJungle is a single registry and gateway for all your MCP servers. Register
  each server once, then point every AI client at one endpoint and let agents
  discover and call the aggregated tools. Tools are namespaced by server, so a
  tool from a server called `github` is exposed as `github/git_commit`.


  🔐 This app runs in **enterprise mode**, which is what turns on client
  authentication. In this mode MCPJungle is deny-by-default: no client can reach
  any registered server until you explicitly create one and allow it. Each
  client gets an access token that it sends as `Authorization: Bearer <token>`,
  and every tool call is attributed to that client.


  Enterprise mode is a runtime mode of the same open-source binary, not a paid
  tier. There is no licence key and no vendor account. It is exposed here as a
  fixed value and deliberately not surfaced as an environment variable, because
  switching it back to `development` would silently remove authentication and
  make every registered server reachable by anything that can reach this port.


  First run: the admin token is generated by `mcpjungle init-server` and is not
  stored in this repo. Create a client for your AI tooling with
  `mcpjungle create mcp-client <name> --allow "<server>,<server>"` and send the
  token it prints in the `Authorization` header.


  ⚠️ MCP clients cannot complete an Umbrel login, so this app's Umbrel app-proxy
  authentication is intentionally off. MCPJungle's own per-client access tokens
  are the authentication layer for both the `/mcp` endpoint and the dashboard.
  Keep port 8080 on your LAN or Tailscale and do not expose it to the internet.
releaseNotes: >-
  - Fix Umbrel app-proxy auth: the manifest appProxyAuth block was inert and every request was redirected to the Umbrel login. Replaced with PROXY_AUTH_ADD "false" on the app_proxy service, which is the documented mechanism and survives a fresh install
  - Remove the non-functional manifest appProxyAuth block rather than leave a setting that claims to disable auth but does not
  - Fix startup crash loop: OpenTelemetry defaulted to enabled, and the Go OTel SDK cannot build a default resource in this distroless cgo-free image without $USER, so the process exited before binding and restart:on-failure looped it while the UI still showed ready
  - OTEL_ENABLED now defaults to false and USER is injected, so it can be enabled safely
  - Packages upstream ghcr.io/mcpjungle/mcpjungle 0.4.6 (linux/amd64 + linux/arm64), digest-pinned
  - Runs in enterprise mode: per-client access tokens and deny-by-default access control
  - Single container with embedded SQLite - no separate database service
  - Replaces the Fiberplane MCP Gateway app, whose per-server proxy path /s/<name>/mcp is unauthenticated by design
developer: MCPJungle
website: https://github.com/mcpjungle/MCPJungle
dependencies: []
repo: https://github.com/mcpjungle/MCPJungle
support: https://github.com/mcpjungle/MCPJungle/issues
port: 8080
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
# NOTE: there is deliberately no `appProxyAuth` block here. One was present and
# set `enabled: false`, and it was inert - the app still redirected to Umbrel's
# app-auth login. The setting that works is PROXY_AUTH_ADD: "false" on the
# app_proxy service in docker-compose.yml. Auth for this app is MCPJungle's own
# admin login and per-client access token.
icon: https://cdn.jsdelivr.net/gh/weirdlywild/solanki-lab-umbrel-store@main/solanki-lab-mcpjungle/icon.svg
environment:
  - name: MCP_SERVER_INIT_REQ_TIMEOUT_SEC
    services:
      - mcpjungle
    default: "10"
    note: Seconds to wait for a registered MCP server to initialise and load its tool list. Raise to 60 for slow-starting upstreams.
  - name: OTEL_ENABLED
    services:
      - mcpjungle
    default: "false"
    options:
      - "false"
      - "true"
    note: Expose Prometheus-compatible OpenTelemetry metrics on /metrics. Leave off unless you have somewhere to scrape them. The app injects USER so enabling it is safe, but the Go OTel SDK cannot build a default resource in this image without it.
submitter: Solanki Lab
submission: https://github.com/weirdlywild/solanki-lab-umbrel-store
