manifestVersion: 1.1
id: solanki-lab-mcpjungle
category: developer
name: MCPJungle
version: "0.4.6-patch.8"
tagline: Self-hosted MCP gateway with a web dashboard for registering and managing your MCP servers
description: >-
  MCPJungle is a single registry and gateway for all your MCP servers. Register
  each server once, then point every AI client at one endpoint and let agents
  discover and call the aggregated tools. Tools are namespaced by server, so a
  tool from a server called `github` is exposed as `github/git_commit`.


  🖥️ **Runs in development mode**, which is what makes the dashboard available:
  MCPJungle only serves its web UI in development mode, and a package that opens
  to a 404 does not meet umbrel's requirement for a usable web UI. Open it at
  `http://<your-umbrel>:8080/` to register MCP servers, inspect their tools, and
  manage clients.


  ⚠️ **Development mode means MCPJungle enforces no authentication of its own.**
  There are no client tokens and no allow lists. Anyone who can reach port 8080
  can use every registered MCP server - including Browser Use, which drives a
  real browser with your network access. Do not expose this port to the internet,
  and prefer Tailscale over plain LAN access.


  🔒 What is still protected: Umbrel's app-proxy authentication is left **on**,
  and only `/mcp` is whitelisted, because MCP clients cannot send Umbrel cookies.
  So the dashboard and the `/api/v0` management API both require an Umbrel login.
  The open surface is the `/mcp` protocol endpoint alone.


  🔧 First run: sign in with your Umbrel account and add your MCP servers from the
  dashboard. Upstreams that are already HTTP-reachable on the umbrel network can
  be pointed at directly, for example Browser Use at
  `http://solanki-lab-browser-use_browser-use_1:8766/mcp`.


  ⚠️ Keep port 8080 on your LAN or Tailscale and do not expose it to the
  internet or through a public reverse-proxy hostname.
website: https://github.com/mcpjungle/MCPJungle
dependencies: []
repo: https://github.com/mcpjungle/MCPJungle
support: https://github.com/mcpjungle/MCPJungle/issues
port: 8080
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
# No appProxyAuth block: it was tried and proved inert on this build. The
# working control is PROXY_AUTH_ADD / PROXY_AUTH_WHITELIST in the compose.
icon: https://cdn.jsdelivr.net/gh/weirdlywild/solanki-lab-umbrel-store@main/solanki-lab-mcpjungle/icon.svg
environment:
  - name: MCP_SERVER_INIT_REQ_TIMEOUT_SEC
    services:
      - mcpjungle
    default: "10"
    note: Seconds to wait for a registered MCP server to initialise and load its tool list. Raise to 60 for slow-starting upstreams.
  - name: OTEL_ENABLED
    services:
      - mcpjungle
    default: "false"
    options:
      - "false"
      - "true"
    note: Expose Prometheus-compatible OpenTelemetry metrics on /metrics. Leave off unless you have somewhere to scrape them. The app injects USER so enabling it is safe, but the Go OTel SDK cannot build a default resource in this image without it.
submitter: Solanki Lab
submission: https://github.com/weirdlywild/solanki-lab-umbrel-store
