manifestVersion: 1.1
id: solanki-lab-mcpjungle
category: developer
name: MCPJungle
version: "0.4.6-patch.9"
tagline: Self-hosted MCP gateway with per-client access tokens and deny-by-default access control
description: >-
  MCPJungle is a single registry and gateway for all your MCP servers. Register
  each server once, then point every AI client at one endpoint and let agents
  discover and call the aggregated tools. Tools are namespaced by server, so a
  tool from a server called `github` is exposed as `github/git_commit`.


  🔐 **Runs in enterprise mode.** Every route is authenticated: `/mcp` requires
  an MCP client token, `/api/v0` requires the admin token, and access is
  deny-by-default, so a client cannot reach any registered server until it is
  explicitly allowed. Anyone who can reach port 8080 without a token gets
  nothing.


  🔧 No manual setup and no root shell. A post-start hook performs the whole
  first-run over the HTTP API - `POST /init` for the admin token, then it
  registers the Browser Use upstream and creates an MCP client called `default`
  with that upstream allowed. Tokens are written to this app's data directory
  with mode 600 and are never printed to the log:

  - `data/admin-access-token` - gateway admin
  - `data/client-access-token` - **this is the one your MCP client sends**, as
    `Authorization: Bearer <token>` to `http://<your-umbrel>:8080/mcp`

  The hook reconciles on every start: if an upstream is missing from the
  client's allow list it is added, and entries you allowed by hand are kept.


  ⚠️ **There is no web dashboard in this mode.** MCPJungle serves its UI only in
  development mode, which is the mode this app exists to avoid, so `/` returns
  404 by design. Management is the REST API under `/api/v0` plus the `mcpjungle`
  CLI. `GET /health` and `GET /metadata` are the only unauthenticated endpoints
  and neither reveals anything sensitive.


  ⚠️ Keep port 8080 on your LAN or Tailscale and do not expose it to the
  internet or through a public reverse-proxy hostname.
website: https://github.com/mcpjungle/MCPJungle
dependencies: []
repo: https://github.com/mcpjungle/MCPJungle
support: https://github.com/mcpjungle/MCPJungle/issues
port: 8080
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
# No appProxyAuth block: it was tried and proved inert on this build. The
# working control is PROXY_AUTH_ADD / PROXY_AUTH_WHITELIST in the compose.
icon: https://cdn.jsdelivr.net/gh/weirdlywild/solanki-lab-umbrel-store@main/solanki-lab-mcpjungle/icon.svg
environment:
  - name: MCP_SERVER_INIT_REQ_TIMEOUT_SEC
    services:
      - mcpjungle
    default: "10"
    note: Seconds to wait for a registered MCP server to initialise and load its tool list. Raise to 60 for slow-starting upstreams.
  - name: OTEL_ENABLED
    services:
      - mcpjungle
    default: "false"
    options:
      - "false"
      - "true"
    note: Expose Prometheus-compatible OpenTelemetry metrics on /metrics. Leave off unless you have somewhere to scrape them. The app injects USER so enabling it is safe, but the Go OTel SDK cannot build a default resource in this image without it.
submitter: Solanki Lab
submission: https://github.com/weirdlywild/solanki-lab-umbrel-store
