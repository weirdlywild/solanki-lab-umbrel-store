version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-mcpjungle_mcpjungle_1
      APP_PORT: 8080
      # Umbrel app-proxy auth is left ON, and only /mcp is whitelisted.
      #
      # This app runs in development mode, which means MCPJungle enforces no
      # authentication of its own: no client tokens, no allow lists, and anyone
      # who can reach this port can drive the registered MCP servers - including
      # a real browser on the LAN. That is the accepted trade for the dashboard
      # UI, which MCPJungle only serves in development mode.
      #
      # The umbrel packaging contract's pattern for protocol endpoints that
      # cannot send umbrel cookies is exactly this: keep proxy auth on and
      # whitelist only the route the protocol needs. So the dashboard and
      # /api/v0 require an umbrel login, and only /mcp is open.
      #
      # A manifest `appProxyAuth: {enabled: ...}` block was tried first and had no
      # effect on this umbrelOS build - the setting had to be made here. Do not
      # trust that manifest block.
      PROXY_AUTH_ADD: "true"
      PROXY_AUTH_WHITELIST: "/mcp"

  mcpjungle:
    image: ghcr.io/mcpjungle/mcpjungle:0.4.6@sha256:59940d2e3a586ab9a063cf24fa37460bc993686fa056729fd1ada25436123dd9
    restart: on-failure
    # The upstream image is distroless and defaults to the nonroot user (65532).
    # Umbrel creates ${APP_DATA_DIR} owned by 1000:1000, so the default UID
    # cannot write the database directory. A static Go binary runs fine as any
    # UID, and matching Umbrel's ownership keeps the registry writable across
    # restarts and updates.
    user: "1000:1000"
    # The base image sets no WORKDIR. With DATABASE_URL unset, MCPJungle creates
    # its SQLite database in the current working directory, so the working
    # directory must be the bind mount or the whole registry is lost on update.
    working_dir: /data
    # No healthcheck: distroless ships no shell and no wget/curl, so any
    # exec-form probe would fail. Verify liveness with:
    #   curl http://<umbrel-host>:8080/health
    environment:
      # Development mode is a fixed literal and deliberately not exposed as an
      # environment variable. It is what makes the dashboard available, and the
      # App Store gate requires a usable web UI. It also means the gateway has no
      # authentication of its own, so the compensating control is app_proxy auth
      # plus a /mcp whitelist above. Flipping this to "enterprise" would remove
      # the dashboard and break the UI gate, so it is not a runtime toggle.
      SERVER_MODE: "development"
      # OpenTelemetry is off by default and must stay off unless USER is set.
      # When enabled, the Go OTel SDK builds a default resource that calls
      # user.Current(). In this distroless, cgo-free build that call needs
      # $USER; without it the initialisation fails, the process exits before it
      # ever binds, and restart:on-failure turns that into a silent crash loop
      # that looks "ready" in the UI while nothing listens on the port.
      # USER below is what makes enabling this safe.
      OTEL_ENABLED: "false"
      MCP_SERVER_INIT_REQ_TIMEOUT_SEC: "10"
      USER: "mcpjungle"
    volumes:
      - ${APP_DATA_DIR}/data:/data
