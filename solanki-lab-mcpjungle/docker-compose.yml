version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-mcpjungle_mcpjungle_1
      APP_PORT: 8080
      # Umbrel app-proxy auth is off, and in enterprise mode that is safe.
      #
      # In development mode this had to be on with /mcp whitelisted, because
      # MCPJungle enforced nothing of its own. In enterprise mode MCPJungle
      # authenticates every route itself: /mcp needs an MCP client token and
      # /api/v0 needs the admin token. There is no unauthenticated surface here
      # except /health and /metadata, which leak nothing.
      #
      # It also has to be off for the post-start hook to work: the hook
      # registers the Browser Use upstream through /api/v0/servers, and with
      # umbrel auth on that path would require a browser session the hook does
      # not have. A management API open to the LAN was the alternative and is
      # not worth it.
      #
      # A manifest `appProxyAuth: {enabled: ...}` block was tried and proved
      # inert on this umbrelOS build. The setting that actually works is the
      # umbrel app setting, not the manifest.
      PROXY_AUTH_ADD: "false"

  mcpjungle:
    image: ghcr.io/mcpjungle/mcpjungle:0.4.6@sha256:59940d2e3a586ab9a063cf24fa37460bc993686fa056729fd1ada25436123dd9
    restart: on-failure
    # The upstream image is distroless and defaults to the nonroot user (65532).
    # Umbrel creates ${APP_DATA_DIR} owned by 1000:1000, so the default UID
    # cannot write the database directory. A static Go binary runs fine as any
    # UID, and matching Umbrel's ownership keeps the registry writable across
    # restarts and updates.
    user: "1000:1000"
    # The base image sets no WORKDIR. With DATABASE_URL unset, MCPJungle creates
    # its SQLite database in the current working directory, so the working
    # directory must be the bind mount or the whole registry is lost on update.
    working_dir: /data
    # No healthcheck: distroless ships no shell and no wget/curl, so any
    # exec-form probe would fail. Verify liveness with:
    #   curl http://<umbrel-host>:8080/health
    environment:
      # Enterprise mode is the whole security model: per-client access tokens on
      # /mcp, admin tokens on /api/v0, and deny-by-default so a client cannot
      # reach a server until it is explicitly allowed. It is a fixed literal and
      # not an exposed environment variable, because switching to "development"
      # silently removes all authentication with no other visible change.
      #
      # The cost is that MCPJungle serves no dashboard in this mode. See the
      # manifest description for how first-run is handled without one.
      SERVER_MODE: "enterprise"
      # OpenTelemetry is off by default and must stay off unless USER is set.
      # When enabled, the Go OTel SDK builds a default resource that calls
      # user.Current(). In this distroless, cgo-free build that call needs
      # $USER; without it the initialisation fails, the process exits before it
      # ever binds, and restart:on-failure turns that into a silent crash loop
      # that looks "ready" in the UI while nothing listens on the port.
      # USER below is what makes enabling this safe.
      OTEL_ENABLED: "false"
      MCP_SERVER_INIT_REQ_TIMEOUT_SEC: "10"
      USER: "mcpjungle"
    volumes:
      - ${APP_DATA_DIR}/data:/data
