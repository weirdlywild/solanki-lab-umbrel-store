version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-9router-go_router_1
      APP_PORT: 20130

  router:
    image: ghcr.io/weirdlywild/9router-go:1.8.17@sha256:dbadba0dfc1e0eb6631a8622e4617ccaea0a3cd2ca6a2bf7f5a6cef489388d03
    restart: on-failure
    init: true
    environment:
      PORT: "20130"
      DB_PATH: /app/data/data.sqlite
      DATA_DIR: /app/data
      RTK_ENABLED: "true"
      CAVEMAN_ENABLED: "false"
      PONYTAIL_ENABLED: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
