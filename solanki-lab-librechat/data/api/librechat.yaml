# For more information, see the Configuration Guide:
# https://www.librechat.ai/docs/configuration/librechat_yaml

# Configuration version (required)
version: 1.2.1

# Cache settings: Set to true to enable caching
cache: true

# Custom interface configuration
interface:
  customWelcome: "Welcome to LibreChat! Enjoy your experience."
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

# Registration
registration:
  socialLogins: ['github', 'google', 'discord', 'openid', 'facebook', 'apple', 'saml']
  allowedDomains:
    - "gmail.com"

# Actions Object Structure
actions:
  allowedDomains:
    - "librechat.ai"
    - "google.com"

# MCP Servers — connect your Fiberplane MCP Gateway (umbrel app, port 3333)
# Uncomment and adjust the server name to match a server registered in the
# gateway, e.g. browserless or searxng:
# mcpServers:
#   gateway-browserless:
#     type: streamable-http
#     url: http://192.168.1.38:3333/s/browserless/mcp
#     headers:
#       Authorization: "Bearer ${GATEWAY_TOKEN}"
#   gateway-searxng:
#     type: streamable-http
#     url: http://192.168.1.38:3333/s/searxng/mcp

# Web search (optional). Enable by setting TAVILY_API_KEY (or a SearXNG URL):
# webSearch:
#   searchProvider:
#     name: SearXNG
#     apiKey: "not-needed"
#     baseUrl: "http://192.168.1.38:8080"
#   scraping:
#     provider: Keenable

# Definition of custom endpoints
endpoints:
  custom:
    # 9Router-Go — your self-hosted model routing gateway (port 20130).
    # Set ROUTER_API_KEY (App Settings env var) to match your 9Router-Go key.
    - name: "9Router-Go"
      apiKey: "${ROUTER_API_KEY:-sk-9router-local}"
      baseURL: "http://192.168.1.38:20130/v1"
      models:
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      forcePrompt: false
      modelDisplayLabel: "9Router-Go"
