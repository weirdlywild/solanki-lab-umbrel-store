# LibreChat configuration (v0.8.8-rc3)
# https://www.librechat.ai/docs/configuration/librechat_yaml
#
# Topology: all umbrelOS apps share the docker network `umbrel_main_network`,
# so services are reached by container name — no LAN IPs are hardcoded here.
# Deployment-specific values come from env vars (see umbrel-app.yml), with
# container-name defaults that work on any umbrel install.
#
# Defaults for this install:
#   - SearXNG:            ${SEARXNG_URL}   (default http://searxng-web:8080)
#   - MCP Gateway:        solanki-lab-mcp-gateway_mcp-gateway_1:3333
#   - Browserless:        solanki-lab-browserless_browserless_1:3000
#   - 9Router-Go:         ${ROUTER_BASE_URL} (default http://solanki-lab-9router-go_router_1:20130/v1)

# Configuration version (required)
version: 1.2.1

# Cache settings: Set to true to enable caching
cache: true

# Custom interface configuration
interface:
  customWelcome: "Welcome to LibreChat! Enjoy your experience."
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

# Registration
registration:
  socialLogins: ['github', 'google', 'discord', 'openid', 'facebook', 'apple', 'saml']
  # NOTE: no allowedDomains — the pre-start hook creates the admin user as
  # umbrel@umbrel.local; a domain allowlist (e.g. gmail.com) would block it
  # and the app would boot with zero users (registration is disabled via env).

# Actions Object Structure — whitelist external API domains for OpenAPI actions
actions:
  allowedDomains:
    - "librechat.ai"
    - "google.com"

# Web search — SearXNG (optional; requires the umbrel SearXNG app)
# rc3 blocks private endpoints by default; `allowedAddresses` exempts the
# container hostname. Engines widened past the default (duckduckgo CAPTCHAs
# most self-hosted instances).
webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_URL}"
  searxngApiKey: ""
  searxngSearchOptions:
    engines: "google,bing,startpage"
    language: "en"
  scraperProvider: "keenable"
  rerankerType: "none"
  allowedAddresses:
    - "searxng-web:8080"

# MCP Servers — connect your Fiberplane MCP Gateway (umbrel app, port 3333).
# Uncomment and adjust the server name to match a server registered in the
# gateway, e.g. browserless or searxng:
# mcpServers:
#   gateway-browserless:
#     type: streamable-http
#     url: http://solanki-lab-mcp-gateway_mcp-gateway_1:3333/s/browserless/mcp
#   gateway-searxng:
#     type: streamable-http
#     url: http://solanki-lab-mcp-gateway_mcp-gateway_1:3333/s/searxng/mcp

# Definition of custom endpoints
endpoints:
  agents:
    # (optional) Agent capabilities available to all users
    capabilities: ["execute_code", "file_search", "actions", "tools"]
    # (optional) Disable the builder interface for agents
    disableBuilder: false
    # (optional) Default recursion depth for agents, defaults to 25
    recursionLimit: 50
    # (optional) Max recursion depth for agents, defaults to 25
    maxRecursionLimit: 100
  custom:
    # 9Router-Go — self-hosted model routing gateway.
    # apiKey + baseURL come from env vars (App Settings):
    #   ROUTER_API_KEY   — the gateway's Bearer key (default sk-9router-local)
    #   ROUTER_BASE_URL  — gateway endpoint (default container name on the umbrel network)
    - name: "9Router-Go"
      apiKey: "${ROUTER_API_KEY}"
      baseURL: "${ROUTER_BASE_URL}"
      models:
        default:
          - "openrouter/auto"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      forcePrompt: false
      modelDisplayLabel: "9Router-Go"
