manifestVersion: 1.1
id: solanki-lab-librechat
category: ai
name: LibreChat
tagline: Enhanced ChatGPT Clone — agents, MCP tools & scheduled chats (0.8.8-rc3)
version: "0.8.8-rc3"
description: >-
  LibreChat is a self-hosted ChatGPT-style chat UI with agents, skills, MCP
  tool integration, message search and multi-provider support.


  ✨ Features
    - 🤖 AI Model Selection: OpenAI-compatible custom endpoints (point at your
      own 9Router-Go gateway), Anthropic, Google, OpenRouter, Ollama and more
    - 🧠 Agents & Tools: no-code agents with MCP servers (browserless, searxng
      via your MCP Gateway), skills (AgentSkills SKILL.md), OpenAPI actions,
      file search and code interpreter
    - ⏱️ Scheduled Chats (v0.8.8): cron schedules, time zones, weekly cadence
      and project destinations — runs agents on a schedule without Telegram
    - 🔍 Message search with bundled Meilisearch
    - 📱 PWA: installable from the browser on Android/iOS/desktop
    - 🔒 Multi-user auth behind umbrelOS login (registration disabled)


  ⚠️ This package tracks the CURRENT release line (v0.8.8-rc3) which ships the
  new Scheduled Chats feature — the official store app is still on 0.8.7
  (no scheduling). The project marks all releases as prereleases; rc3 is the
  current release.

  🔑 The admin login is <username> umbrel@umbrel.local with the per-install
  password from this app's settings (deterministic per install).

  🔗 Custom endpoint for 9Router-Go is pre-wired in the bundled
  librechat.yaml — set the ROUTER_API_KEY env var to match your 9Router-Go
  install (default sk-9router-local).

  📦 Lean package: api + mongodb + meilisearch only (no RAG sidecars). Add
  file-search RAG later by enabling the RAG API service and an embeddings
  provider.
website: https://librechat.ai
dependencies: []
repo: https://github.com/danny-avila/LibreChat
support: https://github.com/danny-avila/LibreChat/issues
port: 7050
gallery: []
path: ""
defaultUsername: "umbrel@umbrel.local"
defaultPassword: ""
deterministicPassword: true
icon: https://cdn.jsdelivr.net/gh/weirdlywild/solanki-lab-umbrel-store@main/solanki-lab-librechat/icon.svg
environment:
  - name: ROUTER_API_KEY
    services:
      - api
    default: "sk-9router-local"
    note: API key for the 9Router-Go custom endpoint (must match your 9Router-Go install's key). Used for the pre-wired endpoint in librechat.yaml.
  - name: TAVILY_API_KEY
    services:
      - api
    default: ""
    note: Optional Tavily API key to enable web search in agents (see webSearch block in librechat.yaml).
  - name: MEILI_MASTER_KEY
    services:
      - meilisearch
    default: "librechat-meili-28730984c254c1c98c148c0e9300f040"
    note: Meilisearch master key (message/conversation search). Changing it requires updating the MEILI_MASTER_KEY in the .env file.
releaseNotes: >-
  - LibreChat v0.8.8-rc3 (current release line, includes Scheduled Chats)
  - Lean package: api + mongodb + meilisearch (RAG sidecars omitted)
  - 9Router-Go custom endpoint pre-wired in librechat.yaml
  - Admin user: umbrel@umbrel.local (per-install password in App Settings)
developer: Danny Avila
submitter: Solanki Lab
submission: https://github.com/weirdlywild/solanki-lab-umbrel-store
