version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solanki-lab-librechat_api_1
      APP_PORT: 3080

  api:
    image: ghcr.io/danny-avila/librechat:v0.8.8-rc3@sha256:b07248d86e020c44101170bde2dbb4ab547df30dd223b4aacd6218cc90e8632b
    restart: on-failure
    user: "1000:1000"
    command: npm run backend
    env_file:
      - path: ${APP_DATA_DIR}/.env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://solanki-lab-librechat_mongodb_1:27017/LibreChat
      MEILI_HOST: http://solanki-lab-librechat_meilisearch_1:7700
      OPENAI_API_KEY: user_provided
      GOOGLE_KEY: user_provided
      ANTHROPIC_API_KEY: user_provided
      ASSISTANTS_API_KEY: user_provided
    volumes:
      - ${APP_DATA_DIR}/data/api/librechat.yaml:/app/librechat.yaml
      - ${APP_DATA_DIR}/data/api/images:/app/client/public/images
      - ${APP_DATA_DIR}/data/api/uploads:/app/uploads
      - ${APP_DATA_DIR}/data/api/logs:/app/api/logs
    depends_on:
      - mongodb
      - meilisearch

  mongodb:
    image: mongo:8.0.10@sha256:98028cf281bb5d49ace5e1ddbd4509e8f1382fe80ef1cf101eeefdc106d76cd4
    restart: on-failure
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data/db:/data/db
    command: mongod --noauth

  meilisearch:
    image: getmeili/meilisearch:v1.12.3@sha256:4acfcbbb9e089aa1aac838cfda3fba7f07aaaef044c23da8acbe0ab741400dac
    restart: on-failure
    user: "1000:1000"
    env_file:
      - path: ${APP_DATA_DIR}/.env
    environment:
      MEILI_HOST: http://solanki-lab-librechat_meilisearch_1:7700
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ${APP_DATA_DIR}/data/meilisearch:/meili_data
